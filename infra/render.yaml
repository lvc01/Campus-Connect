# Render Blueprint — declares the FastAPI Web Service.
# Reference: https://render.com/docs/blueprint-spec
#
# This is intentionally a single free-tier Web Service. We bring up
# the FastAPI server with gunicorn-equivalent (uvicorn multi-worker).
#
# To deploy:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → pick this repo + path.
#   3. After first deploy fails (infant start), set the env vars listed
#      below through the Render UI (or supply a secret group).
#
# Free tier caveats:
#   * Sleeps after 15 minutes of no traffic; UptimeRobot ping keeps it warm.
#   * 750 hours/month. For demo workloads this is plenty.

services:
  - type: web
    name: campus-connect-api
    runtime: python
    plan: free
    rootDir: backend
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: >
      bash -lc "
      python scripts/create_all_schema.py &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --workers 2
      "
    healthCheckPath: /api/v1/health/ping
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: CU Campus Connect
      - key: ALLOWED_EMAIL_DOMAINS
        value: cuhd.in,cumail.in,cubedchd.in
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: OTP_DELIVERY_METHOD
        value: console
      - key: OTP_EXPIRE_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      # ⚠ Add the rest of the secrets through the Render UI:
      #   DATABASE_URL (Supabase direct, port 5432)
      #   REDIS_URL (Upstash, rediss://)
      #   REDIS_ENABLED=true
      #   UPSTASH_SEARCH_URL
      #   UPSTASH_SEARCH_TOKEN
      #   CORS_ORIGINS (the Vercel URL once known)
      #   S3_* for Cloudflare R2
      #   MEILI_HOST / MEILI_API_KEY (leave blank to fall back to ILIKE)
