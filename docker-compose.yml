services:
  db:
    image: postgres:16-alpine
    container_name: campus_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus_connect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-campus_connect}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_connect}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: campus_connect_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: campus_connect_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_ENV: ${MEILI_ENV:-development}
    expose:
      - "7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_connect_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campus_connect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campus_connect}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_connect_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campus_connect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campus_connect}
      REDIS_URL: redis://redis:6379/0
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL_PREFIX: ${S3_PUBLIC_URL_PREFIX:-}
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_connect_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: campus_connect_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  pgbackup:
    image: postgres:16-alpine
    container_name: campus_connect_pgbackup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-campus_connect}
      PGDATABASE: ${POSTGRES_DB:-campus_connect}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command:
      - |
        apk add --no-cache bash findutils
        echo "0 2 * * * pg_dump -Fc > /backups/$${PGDATABASE}_$$(date +\\%Y\\%m\\%d_\\%H\\%M\\%S).dump && find /backups -name '*.dump' -mtime +$$BACKUP_RETENTION_DAYS -delete" | crontab -
        crond -f -l 8
    deploy:
      resources:
        limits:
          memory: 128M

  certbot:
    image: certbot/certbot:latest
    container_name: campus_connect_certbot
    volumes:
      - nginx_certs:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_connect_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campus_connect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campus_connect}
      REDIS_URL: redis://redis:6379/0
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: ["arq", "app.worker.settings.WorkerSettings"]
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  meilisearch_data:
    driver: local
  uploads:
    driver: local
  backups:
    driver: local
  nginx_certs:
    driver: local
